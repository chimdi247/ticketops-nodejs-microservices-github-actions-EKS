server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Auto-discovers every running container on the compose network via the
  # Docker socket and tails its stdout/stderr — no code changes needed in
  # any service to get logs into Loki.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - docker: {}
      # events-api / admin-api / bookings-worker log structured JSON
      # (winston). Parse it so message/level/request_id become filterable
      # labels/fields in Grafana without altering what's logged.
      - match:
          selector: '{service=~"events-api|admin-api|bookings-worker"}'
          stages:
            - json:
                expressions:
                  level: level
                  message: message
                  request_id: request_id
                  service_name: service
            - labels:
                level:
