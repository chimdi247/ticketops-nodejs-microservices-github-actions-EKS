server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # In docker-compose these resolve via the compose network's DNS
    # (service name = hostname). EVENTS_API_UPSTREAM / ADMIN_API_UPSTREAM
    # are injected as environment variables and substituted into this
    # template by the nginx image's docker-entrypoint at container start.
    location /api/ {
        proxy_pass ${EVENTS_API_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass ${ADMIN_API_UPSTREAM}/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth/ {
        proxy_pass ${ADMIN_API_UPSTREAM}/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
